<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pesanan Siap Dikirim | KOPIGO</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/kopigo-logo.svg">
    <meta name="theme-color" content="#faf3e7">
    <link rel="stylesheet" href="css/pesan.css">
</head>

<body>

    <header class="topbar">
        <a class="topbar-brand" href="index.html" aria-label="KOPIGO, kembali ke beranda">
            <img src="assets/kopigo-logo.svg" alt="" width="96" height="96">
        </a>
        <p class="topbar-tag">Menyusuri Rasa Lalu<span>Since 2024</span></p>
    </header>

    <main class="done">

        <div id="done-ready" hidden>
            <h1 id="done-title">Tinggal kirim di WhatsApp</h1>
            <p class="done-lead" id="done-lead">Pesananmu sudah tertulis di WhatsApp. Tekan kirim di sana, lalu tunggu
                balasan admin.</p>

            <section class="done-card" aria-label="Ringkasan pesanan">
                <span class="done-code" id="done-code"></span>
                <ul class="done-list" id="done-list"></ul>
                <div class="done-total">
                    <span id="done-count"></span>
                    <strong id="done-total"></strong>
                </div>
                <p class="done-meta" id="done-meta"></p>
            </section>

            <div class="done-actions">
                <a class="btn-send" id="done-wa" href="pesan.html" target="_blank" rel="noopener">Buka WhatsApp lagi</a>
                <a class="btn-outline" href="pesan.html">Pesan lagi</a>
            </div>
        </div>

        <div id="done-empty" hidden>
            <h1>Belum ada pesanan</h1>
            <p class="done-lead">Pilih menu dulu, lalu kirim pesananmu lewat WhatsApp.</p>
            <div class="done-actions">
                <a class="btn-send" href="pesan.html">Lihat menu</a>
            </div>
        </div>

        <noscript>
            <h1>Halaman ini butuh JavaScript</h1>
            <p class="done-lead"><a href="pesan.html">Kembali ke menu</a></p>
        </noscript>

    </main>

    <script src="js/pesan-terkirim.js" defer></script>
</body>

</html>
